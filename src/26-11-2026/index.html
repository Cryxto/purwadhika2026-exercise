<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <script type="module" src="./app/main.ts"></script> -->
    <title>Blog preview card</title>
    <style>
      /* BEGINNER VERSION: fixed pixel sizes, not responsive on purpose. */

      /* The whole page. */
      body {
        margin: 0; /* remove the browser's default gap around the page */
        padding: 40px; /* space between the card and the window edge */
        background: #eee; /* light gray page */
        font-family: sans-serif;
        color: #333; /* dark gray text */
      }

      /* The white box. Everything else lives inside it. */
      .card {
        width: 320px; /* fixed width */
        margin: 0 auto; /* top/bottom 0, left/right auto = centered horizontally */
        padding: 20px; /* space between the card border and its content */
        background: white;
        border: 2px solid #333; /* thickness, style, color */
      }

      /* Gray box that stands in for the picture. */
      .card__image {
        height: 200px; /* fixed height, the width fills the card */
        background: #ccc;
        border: 1px dashed #666;
        text-align: center; /* center the label left-right */
        line-height: 200px; /* same as height = center the label up-down */
        color: #666;
      }

      /* "Learning" label. */
      .card__tag {
        display: inline-block; /* only as wide as its text, but padding still works */
        margin: 16px 0 0 0; /* top right bottom left */
        padding: 4px 12px;
        background: #ddd;
        border: 1px solid #999;
        font-size: 14px;
        font-weight: bold;
      }

      .card__date {
        margin: 12px 0 0 0;
        font-size: 14px;
      }

      .card__title {
        margin: 12px 0 0 0;
        font-size: 24px;
      }

      .card__text {
        margin: 12px 0 0 0;
        color: #666;
        line-height: 24px; /* space between lines of text */
      }

      /* Row with the avatar and the name. */
      .card__author {
        margin-top: 16px;
        display: flex; /* put the children side by side */
        align-items: center; /* line them up vertically in the middle */
      }

      .card__avatar {
        width: 32px;
        height: 32px;
        margin-right: 12px; /* space between the avatar and the name */
        background: #ccc;
        border: 1px dashed #666;
        border-radius: 50%; /* 50% turns a square into a circle */
      }

      .card__name {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <article class="card">
      <div class="card__image">[ illustration ]</div>

      <p class="card__tag">Learning</p>
      <p class="card__date">Published 21 Dec 2023</p>

      <h1 class="card__title">HTML &amp; CSS foundations</h1>
      <p class="card__text">
        These languages are the backbone of every website, defining structure, content, and
        presentation.
      </p>

      <footer class="card__author">
        <div class="card__avatar"></div>
        <span class="card__name">Greg Hooper</span>
      </footer>
    </article>
  </body>
</html>
